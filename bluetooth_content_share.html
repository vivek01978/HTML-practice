<!DOCTYPE html>
<html>
<head>
    <title>Job Application Form</title>
</head>
<body>
    <h1>Job Application Form</h1>
    <form>
        <label>Full Name:</label>
        <input type="text" name="name" required>
        <br><br>
        <label>Email:</label>
        <input type="email" name="email" required>
        <br><br>
        <label>Mobile Number:</label>
        <input type="tel" name="mobile" required>
        <br><br>
        <label>Date of Birth:</label>
        <input type="date" name="dob">
        <br><br>
        <label>Gender:</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>
        <label>Address:</label><br>
        <textarea name="address" rows="4" cols="30"></textarea>
        <br><br>
        <label>Qualification:</label>
        <select name="qualification">
            <option>Select</option>
            <option>10th</option>
            <option>12th</option>
            <option>Diploma</option>
            <option>Graduation</option>
            <option>Post Graduation</option>
        </select>
        <br><br>
        <label>Skills:</label><br>
        <input type="checkbox" name="skills" value="HTML"> HTML
        <input type="checkbox" name="skills" value="CSS"> CSS
        <input type="checkbox" name="skills" value="JavaScript"> JavaScript
        <input type="checkbox" name="skills" value="Python"> Python
        <input type="checkbox" name="skills" value="Java"> Java
        <br><br>
        <label>Position Applied For:</label>
        <select name="position">
            <option>Select Position</option>
            <option>Software Developer</option>
            <option>Web Developer</option>
            <option>Data Analyst</option>
            <option>AI/ML Engineer</option>
            <option>Intern</option>
        </select>
        <br><br>
        <label>Experience:</label>
        <input type="number" name="experience" min="0" placeholder="Years">
        <br><br>
        <label>Expected Salary:</label>
        <input type="number" name="salary" placeholder="₹">
        <br><br>
        <label>Upload Resume:</label>
        <input type="file" name="resume">
        <br><br>
        <label>Cover Letter:</label><br>
        <textarea name="coverletter" rows="6" cols="40"></textarea>
        <br><br>
        <input type="submit" value="Apply Now">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
